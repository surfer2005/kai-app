# KAI BSB für das iPhone — Projektbeschreibung für XcodeGen (`xcodegen generate` erzeugt daraus das Xcode-Projekt).
# Das Xcode-Projekt selbst liegt nicht im Repository; so bleibt nur diese eine, lesbare Datei zu pflegen.
#
# Brother Print SDK (BRLMPrinterKit.xcframework): liegt aus Lizenzgründen NICHT im Repository. Wer es hat, kopiert es
# nach `Frameworks/` (neben dieser Datei bzw. neben KAIBSB.xcodeproj) — oder legt es EINMAL fest auf den Mac nach
# `~/Documents/Brother/BRLMPrinterKit.xcframework` (Finder: Dokumente → Brother; Peter 2026-11-23: dann muss es nicht in jede
# neue Fassung kopiert werden). `Frameworks/` geht vor. Dann findet der Übersetzer es über die
# Suchpfade unten (`#if canImport(BRLMPrinterKit)` wird wahr) und der Schritt „Brother-Baustein einbetten“ legt es
# signiert in die App. Ohne SDK baut alles wie gehabt, nur Drucken meldet „Drucker-Baustein fehlt“.
name: KAIBSB
options:
  bundleIdPrefix: de.kaibsb
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: de
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Welche Umgebung beim ersten Start vorgewählt ist: test | produktion | entwicklung
    KAI_UMGEBUNG_VORGABE: test
    # Suchpfade für das Brother-SDK (für App UND Prüfungen; fehlt der Ordner, gibt es nur eine Warnung).
    "FRAMEWORK_SEARCH_PATHS[sdk=iphoneos*]": "$(inherited) $(PROJECT_DIR)/Frameworks/BRLMPrinterKit.xcframework/ios-arm64 $(HOME)/Documents/Brother/BRLMPrinterKit.xcframework/ios-arm64"
    # Im Simulator ohne Brother-Baustein (2026-11-23: dort stürzte die App mit ihm beim Start ab; drucken geht im Simulator ohnehin nicht)
targets:
  KAIBSB:
    type: application
    platform: iOS
    sources:
      - path: KAIBSB
    info:
      path: KAIBSB/Info.plist
      properties:
        CFBundleDisplayName: KAI BSB
        CFBundleDevelopmentRegion: de
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        KAIUmgebungVorgabe: "$(KAI_UMGEBUNG_VORGABE)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Zum Scannen der QR-Codes und Barcodes auf Geräte-Etiketten.
        NSMicrophoneUsageDescription: Für die Spracheingabe im KI-Chat.
        NSBluetoothAlwaysUsageDescription: Zum Drucken von Etiketten auf dem Brother-Etikettendrucker (PT-P710BT).
        NSLocalNetworkUsageDescription: Zum Finden und Ansprechen des WLAN-Etikettendruckers (Brother PT-P750W).
        NSBonjourServices: [_pdl-datastream._tcp, _printer._tcp, _ipp._tcp]
        UISupportedExternalAccessoryProtocols: [com.brother.ptcbp]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.kaibsb.kaiapp
        PRODUCT_NAME: KAIBSB
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        # Der Einbetten-Schritt liest aus Frameworks/ und schreibt in die App — braucht dafür freien Zugriff.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      - name: Brother-Baustein einbetten (falls vorhanden)
        basedOnDependencyAnalysis: false
        showEnvVarsInLog: false
        script: |
          set -e
          # 2026-11-23 (Peter am iPhone): „Library not loaded: @rpath/BRLMPrinterKit.framework“ — der Übersetzer hatte den
          # Baustein gefunden und die App damit verknüpft, dieser Schritt hat ihn aber NICHT in die App gelegt (still „fehlt“).
          # Deshalb: zuerst nachsehen, ob die App ihn braucht. Braucht sie ihn und er lässt sich nicht einbetten → anhalten.
          APP="${TARGET_BUILD_DIR}/${FULL_PRODUCT_NAME}"
          VERKNUEPFT=0
          for B in "$APP/${EXECUTABLE_NAME}" "$APP/${EXECUTABLE_NAME}.debug.dylib"; do
            if [ -f "$B" ] && xcrun otool -L "$B" 2>/dev/null | grep -q "BRLMPrinterKit.framework"; then
              VERKNUEPFT=1; echo "App ist mit dem Brother-Baustein verknüpft: $B"
            fi
          done
          if [ "$PLATFORM_NAME" = "iphonesimulator" ]; then echo "Simulator: ohne Brother-Baustein (Drucken nur auf dem iPhone)."; exit 0; fi
          echo "Suche Brother-Baustein (HOME=$HOME, Skript-Sandbox=${ENABLE_USER_SCRIPT_SANDBOXING:-?}):"
          # Gesucht wird überall, wo auch der Übersetzer sucht (Peter 23.11.: Übersetzer fand ihn, dieser Schritt nicht):
          # Frameworks/ und ~/Documents/Brother (je xcframework/ios-arm64), dazu FRAMEWORK_SEARCH_PATHS und BUILT_PRODUCTS_DIR.
          KANDIDATEN="${PROJECT_DIR}/Frameworks/BRLMPrinterKit.xcframework/ios-arm64
          ${HOME}/Documents/Brother/BRLMPrinterKit.xcframework/ios-arm64"
          eval "set -- ${FRAMEWORK_SEARCH_PATHS:-}" 2>/dev/null || set --
          for D in "$@" "${BUILT_PRODUCTS_DIR:-}"; do [ -n "$D" ] && KANDIDATEN="$KANDIDATEN
          $D"; done
          QUELLE=""
          FW=""
          ALTIFS="$IFS"; IFS='
          '
          for K in $KANDIDATEN; do
            K="$(echo "$K" | sed 's/^ *//')"
            if [ -z "$FW" ] && [ -s "$K/BRLMPrinterKit.framework/BRLMPrinterKit" ] && [ -r "$K/BRLMPrinterKit.framework/BRLMPrinterKit" ]; then
              FW="$K/BRLMPrinterKit.framework"; QUELLE="$K"; echo "  gefunden: $FW"
            else
              echo "  $K: $(ls -ld "$K/BRLMPrinterKit.framework/BRLMPrinterKit" 2>&1 | tail -1)"
            fi
          done
          IFS="$ALTIFS"
          echo "Inhalt von ~/Documents/Brother:"; ls -la "${HOME}/Documents/Brother" 2>&1 | sed 's/^/  /' | head -15
          if [ -z "$QUELLE" ]; then
            if [ "$VERKNUEPFT" = "1" ]; then
              echo "error: Die App braucht den Brother-Baustein, er wurde aber an keinem Ort gefunden (Orte und Gründe im Protokoll dieses Schritts). Ohne ihn stürzt die App beim Start ab. Abhilfe: BRLMPrinterKit.xcframework nach Dokumente → Brother legen (genau dieser Name) oder nach Frameworks/ neben KAIBSB.xcodeproj; dann Product → Clean Build Folder."
              exit 1
            fi
            echo "Brother-Baustein fehlt (Frameworks/ bzw. ~/Documents/Brother/BRLMPrinterKit.xcframework) — App ohne Etikettendruck gebaut."
            exit 0
          fi
          SCHEIBE="ios-arm64"
          ZIEL="${TARGET_BUILD_DIR}/${FRAMEWORKS_FOLDER_PATH}"
          mkdir -p "$ZIEL"
          rm -rf "$ZIEL/BRLMPrinterKit.framework"
          if ! ditto "$FW" "$ZIEL/BRLMPrinterKit.framework"; then
            echo "error: Brother-Baustein ließ sich nicht in die App kopieren ($FW → $ZIEL). Abhilfe: Xcode Zugriff auf „Ordner Dokumente“ geben oder den Baustein nach Frameworks/ im Projekt kopieren."
            exit 1
          fi
          if [ ! -s "$ZIEL/BRLMPrinterKit.framework/BRLMPrinterKit" ]; then echo "error: Brother-Baustein in der App ist leer oder fehlt ($ZIEL) — liegt er evtl. nur in iCloud und ist nicht geladen?"; exit 1; fi
          rm -rf "$ZIEL/BRLMPrinterKit.framework/Headers" "$ZIEL/BRLMPrinterKit.framework/Modules"
          if [ -n "${EXPANDED_CODE_SIGN_IDENTITY:-}" ] && [ "${CODE_SIGNING_ALLOWED:-YES}" != "NO" ]; then
            codesign --force --sign "$EXPANDED_CODE_SIGN_IDENTITY" --timestamp=none --preserve-metadata=identifier,flags "$ZIEL/BRLMPrinterKit.framework"
          else
            echo "warning: Brother-Baustein NICHT neu signiert (keine Signatur-Identität) — auf dem iPhone kann das Laden scheitern."
          fi
          echo "Brother-Baustein eingebettet ($SCHEIBE) aus $QUELLE:"
          ls -la "$ZIEL/BRLMPrinterKit.framework"
          codesign -dv "$ZIEL/BRLMPrinterKit.framework" 2>&1 | grep -E "Identifier|TeamIdentifier|Authority" || true
          xcrun otool -L "$ZIEL/BRLMPrinterKit.framework/BRLMPrinterKit" 2>/dev/null | head -12 || true
          /usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$ZIEL/BRLMPrinterKit.framework/Info.plist" 2>/dev/null | sed 's/^/MinimumOSVersion /' || true
  KAIBSBTests:
    type: bundle.unit-test
    platform: iOS
    sources: [KAIBSBTests]
    dependencies:
      - target: KAIBSB
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  KAIBSB:
    build:
      targets:
        KAIBSB: all
        KAIBSBTests: [test]
    test:
      config: Debug
      targets: [KAIBSBTests]
